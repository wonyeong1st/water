<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> </title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 min-h-screen p-4">

<!-- Intro Title Overlay -->
<div id="introTitle" class="fixed inset-0 flex items-center justify-center bg-gray-200 z-50">
  <div class="text-center transition-opacity duration-500 opacity-100">
    <div class="text-lg text-gray-600">생수 입출고 관리</div>
    <div class="text-2xl font-extrabold mt-1">(주) 신성에프앤디</div>
  </div>
</div>
<style>
  
  /* Mobile-friendly tap feedback */
  .tap-btn {
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
  }
  .tap-btn:active {
    transform: scale(0.96);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.25);
    filter: brightness(0.95);
  }
  /* Global JS tap-active effect */
  .tap-active{
    transform: scale(0.97);
    filter: brightness(0.96);
  }

  /* STEP1: long-press visual */
  .long-press-active {
    transform: scale(0.98);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    background-color: #f1f5f9;
  }

  /* long-press menu */
  .slip-action-menu {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .slip-action-box {
    background: white;
    border-radius: 16px;
    padding: 20px;
    width: 80%;
    max-width: 320px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }

    /* 🔒 안드로이드 텍스트 선택 방지 (long-press 전용) */
  .no-select{
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none; /* pointer 이벤트에서 long-press 허용 */
  }
</style>
<script>
  // prevent native context menu globally on cards
  document.addEventListener('contextmenu', function(e){
    if (e.target.closest('.no-select')) {
      e.preventDefault();
      return false;
    }
  }, { passive:false });
</script>
  <div id="appHeader" style="display:none">
  <h1 class="mb-4 text-center">
    <div class="text-lg">🚰 입출고 관리</div>
    <div class="text-2xl font-bold">(주) 신성에프앤디</div>
  </h1>

  <!-- Top bar: totals -->
  <div class="max-w-3xl mx-auto mb-4 grid grid-cols-1 md:grid-cols-3 gap-3">
    <div class="bg-white rounded-2xl shadow p-4 text-center">
      <div class="text-sm text-gray-500">개인 재고 (18.9L)</div>
      <div id="myStock189" class="text-4xl font-extrabold">0</div>
    </div>
    <div class="bg-white rounded-2xl shadow p-4 text-right">
      <div class="text-sm text-gray-500 text-center">명성 정산 누적</div>
      <div id="sumM" class="text-2xl font-extrabold">0원</div>
    </div>
    <div class="bg-white rounded-2xl shadow p-4 text-right">
      <div class="text-sm text-gray-500 text-center">음봉 정산 누적</div>
      <div id="sumE" class="text-2xl font-extrabold">0원</div>
    </div>
  </div>

  <!-- Main nav -->
  <div class="max-w-3xl mx-auto mb-4 grid grid-cols-2 gap-3">
    <button class="tap-btn rounded-2xl bg-red-600 text-white font-extrabold py-5 text-lg shadow" onclick="tap(); showShippingWith('명성')">🚚 명성 출고</button>
    <button class="tap-btn rounded-2xl bg-blue-600 text-white font-extrabold py-5 text-lg shadow" onclick="tap(); showShippingWith('음봉')">🚚 음봉 출고</button>
    <button class="tap-btn rounded-xl bg-slate-700 text-white font-bold py-3" onclick="tap(); show('hist_m')">📦 명성 조회</button>
    <button class="tap-btn rounded-xl bg-slate-800 text-white font-bold py-3" onclick="tap(); show('hist_e')">📦 음봉 조회</button>
    <button class="tap-btn rounded-xl bg-emerald-600 text-white font-bold py-3" onclick="tap(); show('inbound')">📥 입고/반납</button>
    <button class="tap-btn rounded-xl bg-orange-500 text-white font-bold py-3" onclick="tap(); show('settings')">⚙ 설정</button>
  </div>
</div>

  <div id="screen" class="max-w-3xl mx-auto"></div>

  <script>
/************************************************************
 * STEP 3-2 (1차): 구조 정렬 — 동작/화면 변경 없음
 * 목적: 이후 수정 시 안정성 확보를 위한 구역 표시만 추가
 * 범위: 주석 추가 ONLY (코드 이동/삭제/로직 변경 없음)
 ************************************************************/

// ===== 섹션 목차 =====
// 1) Utils (진동/사운드/날짜/저장)
// 2) Storage Keys + Defaults
// 3) Global State (런타임 상태)
// 4) Navigation / Routing
// 5) Screens (Home / Shipping / Inbound / History / Settings)
// 6) Gestures (Long-press 등)
// =====================

/********************
 * 1) Utils (진동/사운드/날짜/저장)
 ********************/
// haptic + click feedback
  // haptic + click sound feedback
  let __audioCtx;
  function tap(){
    try{
      // mark manual tap to avoid double-fire
      window.__lastTapAt = Date.now();
      if (navigator.vibrate) navigator.vibrate(20);
      if (!__audioCtx) __audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (__audioCtx.state === 'suspended') __audioCtx.resume();
      const o = __audioCtx.createOscillator();
      const g = __audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 320;
      g.gain.value = 0.06;
      o.connect(g); g.connect(__audioCtx.destination);
      o.start();
      o.stop(__audioCtx.currentTime + 0.05);
    }catch(e){}
  }

  // Mobile: focus on number input should select the whole value for fast overwrite
  // & Press Enter to dismiss keyboard
  function bindAutoSelectInput(inp){
    if (!inp || inp.__autoSelectBound) return;
    inp.__autoSelectBound = true;

    const selectAll = ()=>{
      try{
        // On Android, selection often works only after the keyboard is up
        setTimeout(()=>{
          try{ inp.focus(); }catch(e){}
          try{ inp.select(); }catch(e){}
          try{ inp.setSelectionRange(0, String(inp.value||'').length); }catch(e){}
        }, 0);
      }catch(e){}
    };

    inp.addEventListener('focus', selectAll);
    inp.addEventListener('click', selectAll);

    // [추가된 기능] 엔터키(Enter)를 누르면 입력칸에서 빠져나오기(키보드 숨김)
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault(); // 줄바꿈 등 기본 동작 막기
        inp.blur();         // 포커스 해제 (키보드 내려감)
      }
    });
  }

  // GLOBAL: auto haptic+sound for all buttons (safe, no double)
  document.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if (!btn || btn.disabled) return;
    // avoid double-fire if tap() already called inline
    if (window.__lastTapAt && Date.now() - window.__lastTapAt < 120) return;
    tap();
  }, { passive:true });

  // STEP2: gesture helper (future split candidate)
  /********************
 * 6) Gestures (Long-press 등)
 ********************/
function bindLongPress(el, onLong){
    let timer;
    el.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      timer = setTimeout(()=>{
        tap();
        el.classList.add('long-press-active');
        onLong();
      }, 550);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
      el.addEventListener(ev, ()=>{
        clearTimeout(timer);
        el.classList.remove('long-press-active');
      });
    });
  }

  /********************
 * 2) Storage Keys + Defaults
 ********************/
  const KEYS = {
    items: 'items',
    outgo: 'outgoRecords',
    inbound: 'inboundRecords',
    myStock: 'myStock',
    containerHeld: 'containerHeld',
    settlement: 'settlement',
    personalRate: 'personalRate189',
    truckSize: 'truckSize864',
    lastSettled: 'lastSettledDate',
    priceSchedule: 'priceScheduleData'
  };

  const DEFAULT_ITEMS = [
    { name:'18.9L', myeongseong:0, eumbong:1800, lock:true, pinned:true },
    { name:'500ml', myeongseong:2150, eumbong:2600, pinned:true },
    { name:'2.0L', myeongseong:2000, eumbong:1850, pinned:false },
    { name:'330ml', myeongseong:2600, eumbong:2508, pinned:false },
    { name:'1.0L (12개)', myeongseong:2530, eumbong:2530, pinned:false },
    { name:'종이컵(6.5oz)', myeongseong:8100, eumbong:8800, pinned:false },
    { name:'봉투컵', myeongseong:13000, eumbong:0, pinned:false },
    { name:'(동원)13L', myeongseong:2200, eumbong:0, pinned:false }
  ];

  const CONTAINER_TYPES = [
    { key:'189_crate', label:'18.9L 크레이트' },
    { key:'189_empty', label:'18.9L 빈통' },
    { key:'13_crate',  label:'13L 크레이트' },
    { key:'13_empty',  label:'13L 빈통' }
  ];

  function loadJSON(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch {
      return fallback;
    }
  }
  function saveJSON(key, value){ localStorage.setItem(key, JSON.stringify(value)); }
  function num(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
  // Local date (YYYY-MM-DD) without UTC shift
  function toLocalISO(d){
    const x = new Date(d.getTime() - d.getTimezoneOffset()*60000);
    return x.toISOString().slice(0,10);
  }
  function todayISO(){ return toLocalISO(new Date()); }
  function uid(){ return Date.now() + Math.floor(Math.random()*1000); }
  function money(n){ return (num(n)).toLocaleString() + '원'; }

  /********************
 * 3) Global State (런타임 상태)
 ********************/
// state
  let items = loadJSON(KEYS.items, DEFAULT_ITEMS);
  // STEP 3: 전표 수정용 상태
  let editingRecord = null;
  let outgoRecords = loadJSON(KEYS.outgo, []);
  let inboundRecords = loadJSON(KEYS.inbound, []);
  let myStock = loadJSON(KEYS.myStock, { '18.9L': 0 });
  let containerHeld = loadJSON(KEYS.containerHeld, { 명성:{}, 음봉:{} });
  let settlement = loadJSON(KEYS.settlement, { myeong:0, eumbong:0 });
  let lastSettled = loadJSON(KEYS.lastSettled, { 명성:'', 음봉:'' });
  let priceSchedule = loadJSON(KEYS.priceSchedule, { personalRate: null, items: null });
  let personalRate = num(localStorage.getItem(KEYS.personalRate) || 1800);
  let truckSize = num(localStorage.getItem(KEYS.truckSize) || 864);

  // 전표 날짜(dateStr) 기준으로 유효한 개인재고 18.9L 단가 반환
  function getEffectivePersonalRate(dateStr){
    const d = dateStr || todayISO();
    const sched = priceSchedule && priceSchedule.personalRate;
    if (sched && sched.applyFrom && d < sched.applyFrom && sched.prevRate !== undefined) {
      return num(sched.prevRate);
    }
    return num(personalRate);
  }

  // 전표 날짜(dateStr) 및 창고(wh) 기준으로 유효한 품목 단가 반환
  function getEffectiveItemPrice(it, wh, dateStr){
    if (!it) return 0;
    if (wh === '명성' && it.name === '18.9L') return 0;
    const d = dateStr || todayISO();
    const sched = priceSchedule && priceSchedule.items;
    if (sched && sched.applyFrom && d < sched.applyFrom && sched.prevItems && sched.prevItems[it.name]) {
      const prev = sched.prevItems[it.name];
      return wh === '명성' ? num(prev.myeongseong) : num(prev.eumbong);
    }
    return wh === '명성' ? num(it.myeongseong) : num(it.eumbong);
  }

  // ensure containerHeld structure
  for (const wh of ['명성','음봉']) {
    containerHeld[wh] = containerHeld[wh] || {};
    for (const t of CONTAINER_TYPES) if (containerHeld[wh][t.key] === undefined) containerHeld[wh][t.key] = 0;
  }

  function normalizeItemsData(){
    if (!items.find(x => x.name === '18.9L')) {
      items.unshift({ ...DEFAULT_ITEMS[0] });
    }
    // 기존 저장 데이터에 pinned 속성이 아직 없는 경우: 18.9L와 500ml를 기본 표시(주요 품목)로 지정하고 상단 배치
    if (items.length > 0 && items.every(x => x.pinned === undefined)) {
      items.forEach(x => {
        x.pinned = (x.name === '18.9L' || x.name === '500ml');
      });
      items.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
    }
    saveJSON(KEYS.items, items);
  }
  normalizeItemsData();

  function syncHeader(){
    document.getElementById('sumM').innerText = money(settlement.myeong);
    document.getElementById('sumE').innerText = money(settlement.eumbong);
    document.getElementById('myStock189').innerText = (myStock['18.9L'] || 0);
  }

  /********************
 * 5) Screens
 ********************/
  /********************
 * 4) Navigation / Routing
 * - show()
 * - showShippingWith()
 * - history / popstate
 ********************/
function show(name){
    // 뒤로가기 히스토리 처리 (메인 제외)
    if (name !== 'home') {
      history.pushState({ screen: name }, '', '#'+name);
    }
    // STEP 2: 메인 화면이 아닐 때 상단 헤더 숨김
    const header = document.getElementById('appHeader');
    if (header) header.style.display = (name === 'home') ? 'block' : 'none';

    if (name === 'home') return renderHome();
    if (name === 'shipping') return renderShipping();
    if (name === 'inbound') return renderInbound();
    if (name === 'hist_m') return renderHistory('명성');
    if (name === 'hist_e') return renderHistory('음봉');
    if (name === 'inbound_hist') return renderInboundHistory();
    if (name === 'settings') return renderSettings();
  }

  function showShippingWith(wh){
    // 출고 진입은 반드시 show('shipping')을 거치게 함
    show('shipping');
    setTimeout(() => {
      const btn = document.querySelector(`.ship-wh-btn[data-wh="${wh}"]`);
      if (btn) btn.click();
    }, 0);
  }

  function __show_placeholder__(){
    if (name === 'home') return renderHome();
    if (name === 'shipping') return renderShipping();
    if (name === 'inbound') return renderInbound();
    if (name === 'hist_m') return renderHistory('명성');
    if (name === 'hist_e') return renderHistory('음봉');
    if (name === 'settings') return renderSettings();
  }

  function renderHome(){
    const el = document.getElementById('screen');
    el.innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white rounded-2xl shadow p-4">
          <div class="text-sm text-gray-500 text-center">개인 재고 (18.9L)</div>
          <div class="text-5xl font-extrabold mt-1 text-center">${myStock['18.9L'] || 0}</div>
          <div class="text-sm text-gray-500 mt-2">명성에서 18.9L를 출고하면 개인 재고가 자동 차감됩니다.</div>
        </div>
        <div class="bg-white rounded-2xl shadow p-4">
          <div class="font-bold mb-2">공병/크레이트 보유 (명성 기준)</div>
          <div class="grid grid-cols-1 gap-2 text-sm">
            ${CONTAINER_TYPES.map(t => `
              <div class="flex justify-between">
                <span>${t.label}</span>
                <span class="font-extrabold">${containerHeld['명성'][t.key] || 0}</span>
              </div>`).join('')}
          </div>
          <div class="text-xs text-gray-400 mt-2">※ 음봉 창고 수량은 입고/반납 메뉴에서 확인</div>
        </div>
      </div>

    `;
  }

  /********************
   * Shipping (출고)
   ********************/
  function renderShipping(){
    const el = document.getElementById('screen');
    el.innerHTML = `
      <div class="bg-white rounded-2xl shadow p-4 space-y-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="text-xl font-extrabold">🚚 출고</div>
            ${editingRecord ? `<span class=\"px-2 py-0.5 rounded-full bg-yellow-200 text-yellow-800 text-xs font-extrabold\">수정 중</span>` : ``}
          </div>
          <div class="text-sm text-gray-500">날짜는 기본 오늘, 필요 시 과거로 변경</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="text-sm font-semibold">창고</label>
            <div class="flex gap-2" id="shipWarehouseWrap">
              <button data-wh="명성" class="ship-wh-btn flex-1 rounded-xl bg-rose-200 text-rose-900 font-extrabold py-2 border-4 border-rose-500">명성</button>
              <button data-wh="음봉" class="ship-wh-btn flex-1 rounded-xl bg-sky-200 text-sky-900 font-extrabold py-2 border-2 border-transparent">음봉</button>
            </div>
          </div>
          <div>
            <label class="text-sm font-semibold">날짜</label>
            <input id="shipDate" type="date" class="w-full border p-2 rounded-xl bg-gray-50" />
          </div>
        </div>

        <div class="border rounded-2xl p-3 bg-gray-50">
          <div class="flex items-center justify-between mb-2">
            <div class="font-bold">출고 수량 입력</div>
            <div class="text-xs text-gray-500">※ 명성 18.9L 단가 0원(개인재고 차감)</div>
          </div>
          <div id="shipItems" class="space-y-3">
            <div id="shipMainItems" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
            <div id="shipOtherSection" class="hidden space-y-2">
              <button type="button" id="toggleOtherItemsBtn" class="w-full py-2.5 px-3 rounded-xl bg-white border border-gray-300 text-sm font-bold text-gray-700 flex items-center justify-center gap-2 shadow-sm">
                <span id="toggleOtherItemsText">▼ 기타 품목 펼치기</span>
                <span id="otherItemsBadge" class="hidden px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 text-xs font-extrabold"></span>
              </button>
              <div id="shipOtherItems" class="hidden grid grid-cols-1 md:grid-cols-2 gap-3 pt-1"></div>
            </div>
          </div>
        </div>

        <div class="border rounded-2xl p-3 bg-gray-50">
          <div class="flex items-center justify-between mb-2">
            <div class="font-bold">공병/크레이트 수거</div>
            <span class="text-xs text-gray-500">고객에게서 수거한 빈통/크레이트</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="collectBoxes"></div>
        </div>

        <div class="flex items-center justify-between bg-white border rounded-2xl p-4">
          <div class="font-bold">총 금액</div>
          <div id="shipTotal" class="text-2xl font-extrabold text-blue-600">0원</div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button id="shipSave" class="rounded-2xl bg-red-600 text-white font-extrabold py-4 shadow">저장</button>
          <button id="shipClear" class="rounded-2xl bg-gray-700 text-white font-bold py-4 shadow">입력 초기화</button>
        </div>

        <div class="text-sm text-gray-500">
          저장 시 규칙: (1) 명성 출고의 18.9L는 개인 재고에서 차감되고 정산 금액에는 반영되지 않습니다. (2) 명성 출고의 나머지 품목은 명성 정산에 누적됩니다. (3) 음봉 출고는 음봉 단가로 음봉 정산에 누적됩니다.
        </div>
      </div>
    `;

    let selectedWarehouse = '명성';

    const whButtons = document.querySelectorAll('.ship-wh-btn');

    function applyWarehouseStylesButtonsOnly(){
      whButtons.forEach(b => {
        b.classList.remove('border-4','border-rose-500','border-sky-500','shadow-lg','scale-95');
        b.classList.add('border-2','border-transparent','shadow','transition','duration-150');
        const chk = b.querySelector('.wh-check');
        if (chk) chk.remove();
      });
      const active = Array.from(whButtons).find(b => b.dataset.wh === selectedWarehouse);
      if (active) {
        active.classList.remove('border-2','border-transparent');
        active.classList.add('border-4','shadow-lg','scale-95');
        active.classList.add(selectedWarehouse === '명성' ? 'border-rose-500' : 'border-sky-500');
        const span = document.createElement('span');
        span.className = 'wh-check ml-2 text-lg font-extrabold';
        span.innerText = '✓';
        active.appendChild(span);
      }
    }

    function applyWarehouseStyles(){
      applyWarehouseStylesButtonsOnly();
      if (!shipItems) return;
      shipItems.querySelectorAll('input[type="number"]').forEach(inp => {
        inp.classList.remove('border-rose-400','border-sky-400');
        inp.classList.add(selectedWarehouse === '명성' ? 'border-rose-400' : 'border-sky-400');
      });
      const totalEl = document.getElementById('shipTotal');
      totalEl.classList.remove('text-rose-600','text-sky-600');
      totalEl.classList.add(selectedWarehouse === '명성' ? 'text-rose-600' : 'text-sky-600');
    }

    whButtons.forEach(btn => {
      btn.onclick = () => {
        selectedWarehouse = btn.dataset.wh;

    });

    const shipItems = document.getElementById('shipItems');

    if (mainEntries.length === 0) {
      shipMainItems.innerHTML = items.map((it, idx) => renderShipItemCard(it, idx)).join('');
      shipOtherSection.classList.add('hidden');
    } else {
      shipMainItems.innerHTML = mainEntries.map(x => renderShipItemCard(x.it, x.idx)).join('');
      if (otherEntries.length > 0) {
        shipOtherSection.classList.remove('hidden');
        shipOtherItems.innerHTML = otherEntries.map(x => renderShipItemCard(x.it, x.idx)).join('');
      } else {
        shipOtherSection.classList.add('hidden');
      }
    }

    let otherExpanded = false;
    function updateOtherItemsToggleUI(){
      if (!otherEntries.length) return;
      let activeOtherCount = 0;
      shipOtherItems.querySelectorAll('input[type="number"]').forEach(inp => {
        if (num(inp.value) !== 0) activeOtherCount++;
      });
      if (otherExpanded) {
        shipOtherItems.classList.remove('hidden');
        toggleOtherItemsText.innerText = `▲ 기타 품목 접기 (${otherEntries.length}개)`;
      } else {
        shipOtherItems.classList.add('hidden');
        toggleOtherItemsText.innerText = `▼ 기타 품목 펼치기 (${otherEntries.length}개)`;
      }
      if (activeOtherCount > 0) {
        otherItemsBadge.classList.remove('hidden');
        otherItemsBadge.innerText = `입력 ${activeOtherCount}건`;
      } else {
        otherItemsBadge.classList.add('hidden');
      }
    }

    if (toggleOtherItemsBtn) {
      toggleOtherItemsBtn.onclick = () => {
        otherExpanded = !otherExpanded;
        updateOtherItemsToggleUI();
      };
    }

    const collectBoxes = document.getElementById('collectBoxes');
    collectBoxes.innerHTML = CONTAINER_TYPES.map(t => `

        <div class="flex items-center gap-1">
          <button class="qty-btn px-3 py-2 rounded-lg bg-gray-200 font-bold" data-step="-1" data-ct="${t.key}">−</button>

        </div>

    // ✏ 전표 수정 모드: 실제 입력값 복원 (DOM 생성 이후)

      const hasOtherQty = Array.from(shipOtherItems.querySelectorAll('input[type="number"]')).some(inp => num(inp.value) !== 0);

      // 수거 공병/크레이트 복원
      collectBoxes.querySelectorAll('input[data-ct]').forEach(inp => {

    function refreshShipPriceLabels(){
      const d = getShipDateVal();
      shipItems.querySelectorAll('[data-price-label]').forEach(el => {
        const idx = Number(el.dataset.priceLabel);
        const it = items[idx];
        if (!it) return;
        const mPrice = getEffectiveItemPrice(it, '명성', d);
        const ePrice = getEffectiveItemPrice(it, '음봉', d);
        el.innerText = `명성: ${num(mPrice).toLocaleString()} / 음봉: ${num(ePrice).toLocaleString()}`;
      });
    }

    function calcShipTotal(){
      const d = getShipDateVal();
      let total = 0;
      shipItems.querySelectorAll('input[type="number"]').forEach(inp => {
        const idx = Number(inp.dataset.idx);
        const q = num(inp.value);
        if (q === 0) return;
        const it = items[idx];
        const price = getEffectiveItemPrice(it, selectedWarehouse, d);
        total += q * price;
      });
      document.getElementById('shipTotal').innerText = money(total);
      updateOtherItemsToggleUI();
      return total;
    }

    document.getElementById('shipDate').addEventListener('change', () => {
      refreshShipPriceLabels();
      calcShipTotal();
    });

    shipItems.addEventListener('input', calcShipTotal);

    // 숫자 입력칸: 눌렀을 때 전체 선택(0 지우기/커서 이동 없이 바로 입력)
    shipItems.querySelectorAll('input[type="number"]').forEach(inp => bindAutoSelectInput(inp));

    shipItems.querySelectorAll('.qty-btn').forEach(btn => {

      calcShipTotal();
    };

    document.getElementById('shipSave').onclick = () => {
      const wh = selectedWarehouse;
      const date = document.getElementById('shipDate').value || todayISO();

      const lines = [];
      shipItems.querySelectorAll('input[type="number"]').forEach(inp => {
        const idx = Number(inp.dataset.idx);
        const q = num(inp.value);
        if (q !== 0) lines.push({ name: items[idx].name, qty: q });
      });

      const collected = {};
      collectBoxes.querySelectorAll('input[type="number"]').forEach(inp => {
        const k = inp.dataset.ct;
        const q = num(inp.value);
        if (q !== 0) collected[k] = q;
      });

      if (lines.length === 0 && Object.keys(collected).length === 0) {
        alert('출고 수량 또는 수거 수량을 입력해주세요.');
        return;
      }

      // ✏ 수정 모드: 기존 전표 롤백
      if (editingRecord) {
        editingRecord.editedAt = Date.now();
        const r = editingRecord;
        if (r.items && r.items.length) {
          if (r.warehouse === '명성') {
            for (const ln of r.items) {
              if (ln.name === '18.9L') {
                myStock['18.9L'] = num(myStock['18.9L']) + num(ln.qty);
              } else {
                const it = items.find(x => x.name === ln.name) || {};
                settlement.myeong -= num(ln.qty) * getEffectiveItemPrice(it, '명성', r.date);
              }
            }
          } else {
            for (const ln of r.items) {
              const it = items.find(x => x.name === ln.name) || {};
              settlement.eumbong -= num(ln.qty) * getEffectiveItemPrice(it, '음봉', r.date);
            }
          }
        }
        if (r.collected) {
          for (const k of Object.keys(r.collected)) {
            containerHeld[r.warehouse][k] = num(containerHeld[r.warehouse][k]) - num(r.collected[k]);
          }
        }
        outgoRecords = outgoRecords.filter(x => x.id !== r.id);
      
      }

      // ➕ 신규(또는 수정 후) 반영 (해당 전표 날짜의 유효 단가 적용)
      if (lines.length > 0) {
        if (wh === '명성') {
          for (const ln of lines) {
            if (ln.name === '18.9L') {
              myStock['18.9L'] = num(myStock['18.9L']) - num(ln.qty);
            } else {
              const it = items.find(x => x.name === ln.name) || {};
              settlement.myeong += num(ln.qty) * getEffectiveItemPrice(it, '명성', date);
            }
          }
        } else {
          for (const ln of lines) {
            const it = items.find(x => x.name === ln.name) || {};
            settlement.eumbong += num(ln.qty) * getEffectiveItemPrice(it, '음봉', date);
          }
        }
      }

      if (Object.keys(collected).length > 0) {
        for (const k of Object.keys(collected)) {
          containerHeld[wh][k] = num(containerHeld[wh][k]) + num(collected[k]);
        }
      }

      const record = { id: uid(), date, warehouse: wh, items: lines, collected, total: calcShipTotal(), ...(editingRecord ? { editedAt: Date.now() } : {}) };

      // ⭐ 방금 출고한 전표 표시용
      localStorage.setItem('lastShipId', String(record.id));
      outgoRecords.push(record);

      saveJSON(KEYS.outgo, outgoRecords);
      saveJSON(KEYS.myStock, myStock);
      saveJSON(KEYS.containerHeld, containerHeld);
      saveJSON(KEYS.settlement, settlement);

      editingRecord = null;
      syncHeader();
      alert('출고 저장 완료');
      show(wh === '명성' ? 'hist_m' : 'hist_e');
    };

    calcShipTotal();
  }

        if (!confirm('이 전표를 삭제할까요?\n(재고/정산이 함께 되돌려집니다)')) return;

        // rollback
        if(record.type === 'personal_inbound'){
          myStock['18.9L'] = num(myStock['18.9L']) - num(record.qty);
          settlement.eumbong -= num(record.amount);

        if(record.type === 'container_return'){

      const list = inboundRecords.filter(r => r.date >= s && r.date <= e)

      for(const r of list){

          </div>
          <div class="mt-2">
            ${isIn
              ? `수량 +${r.qty} / ${money(r.amount)}`
              : Object.keys(r.changes || {})
                  .map(k => {
                    const label = (CONTAINER_TYPES.find(t => t.key === k) || {}).label || k;
                    return `<div>${label}: ${r.changes[k]}</div>`;
                  })
                  .join('')}
          </div>`;
            `;
            }).join('')}
          </div>`;
        let t;
        card.addEventListener('pointerdown', e=>{
          e.preventDefault();
          t=setTimeout(()=>{
            tap();
            card.classList.add('long-press-active');
            openSlipActionMenuInbound(r);
          },550);
        });
        ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
          card.addEventListener(ev, ()=>{
            clearTimeout(t);
            card.classList.remove('long-press-active');
          });
        });
        res.appendChild(card);
      }
    }
    ihQuick.onchange = ()=>{
      const now=new Date();
      if(ihQuick.value==='this'){
        ihStart.value=toLocalISO(new Date(now.getFullYear(),now.getMonth(),1));
        ihEnd.value=toLocalISO(now);

        ihStart.value=toLocalISO(new Date(now.getFullYear(),now.getMonth()-1,1));
        ihEnd.value=toLocalISO(new Date(now.getFullYear(),now.getMonth(),0));
      }
    };
    document.getElementById('ihSearch').onclick = run;
    setTimeout(run,0);
  }

        if(!confirm("이 전표를 삭제할까요?\n(재고 및 정산도 함께 되돌립니다)")) return;

        // 🔁 롤백 처리 (출고 품목)
        if(record.items && record.items.length){
          if(record.warehouse === '명성'){
            for(const ln of record.items){
              if(ln.name === '18.9L'){
                myStock['18.9L'] = num(myStock['18.9L']) + num(ln.qty);

                settlement.myeong -= num(ln.qty) * getEffectiveItemPrice(it, '명성', record.date);

          }

        if(record.collected){

            containerHeld[record.warehouse][k] = num(containerHeld[record.warehouse][k]) - num(record.collected[k]);
          }
        }

        // 전표 삭제
        outgoRecords = outgoRecords.filter(r=> r.id !== record.id);

        // 저장
        saveJSON(KEYS.outgo, outgoRecords);
        saveJSON(KEYS.myStock, myStock);
        saveJSON(KEYS.containerHeld, containerHeld);
        saveJSON(KEYS.settlement, settlement);

          </div>
          <div>
            <label class="text-sm font-semibold">종료일</label>
            <input id="hEnd" type="date" class="w-full border p-2 rounded-xl bg-gray-50" />
          </div>

            <select id="hMode" class="w-full border p-2 rounded-xl bg-gray-50">
              <option value="slip">전표별 보기 (최신순)</option>

        hStart.value = toLocalISO(s);
        hEnd.value = toLocalISO(now);

      const mode = document.getElementById('hMode').value;
      const res = document.getElementById('hResult');

        res.innerHTML = `<div class="text-center text-gray-500">출고 내역이 없습니다.</div>`;
        return;

      if (mode === 'slip') {
        const sorted = [...filtered].sort((a,b) => {
          if (a.date !== b.date) return a.date < b.date ? 1 : -1;
          return b.id - a.id;
        });
        for (const r of sorted) {
          const itemsHtml = (r.items || []).map(i => `<div class='text-sm'>- ${i.name}: ${i.qty}개</div>`).join('') || `<div class='text-sm text-gray-400'>(출고 품목 없음)</div>`;

            card.classList.remove('long-press-active');
          });
          card.addEventListener('pointerleave', () => clearTimeout(pressTimer));
          card.addEventListener('pointercancel', () => clearTimeout(pressTimer));

          res.appendChild(card);
        }
      } else {
        const summary = {};
        const summaryAmt = {};
        for (const r of filtered) {
          for (const it of (r.items || [])) {
            const q = num(it.qty);
            summary[it.name] = (summary[it.name] || 0) + q;

        let total = 0;
        let rows = '';
        for (const name of Object.keys(summary)) {
          const qty = summary[name];
          const sum = summaryAmt[name] || 0;
          total += sum;
          rows += `<div class='flex justify-between py-1 border-b'><div>${name} <span class='text-gray-500 text-sm'>(${qty}개)</span></div><div class='font-semibold'>${money(sum)}</div></div>`;

          <div class='mt-3 flex justify-between text-lg font-extrabold'><span>총 합계</span><span class='text-blue-700'>${money(total)}</span></div>

        `;
        res.appendChild(box);
      }
    };

    document.getElementById('hSearch').onclick = runSearch;

    // 🔹 기본 동작: 화면 열리자마자 검색 실행
    document.getElementById('hMode').value = 'slip';
    setTimeout(runSearch, 0);

    // CSV 다운로드


    document.getElementById('hCSV').onclick = () => {
      const filtered = getFiltered();
      if (filtered.length === 0) return alert('내보낼 데이터가 없습니다.');
      let csv = 'date,warehouse,item,qty,total\n';
      for (const r of filtered) {
        if (r.items && r.items.length) {
          for (const it of r.items) {
            csv += `${r.date},${r.warehouse},${it.name},${it.qty},${r.total || 0}\n`;
          }
        } else {
          csv += `${r.date},${r.warehouse},(none),0,${r.total || 0}\n`;
        }
      }
      const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${warehouse}_출고_${hStart.value}_${hEnd.value}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };
  }

      function updateCalc(){
        const s = stStart.value || '0000-00-00';
        const e = stEnd.value || '9999-12-31';

        const shipList = outgoRecords.filter(r => r.warehouse === wh && r.date >= s && r.date <= e);
        const shipSum = shipList.reduce((acc, r) => acc + num(r.total), 0);

        overlay.querySelector('#stShipCount').innerText = shipList.length;
        overlay.querySelector('#stShipSum').innerText = money(shipSum);

        let inbSum = 0;
        if (!isM) {
          const inbList = inboundRecords.filter(r => r.type === 'personal_inbound' && r.date >= s && r.date <= e);
          const rawInbSum = inbList.reduce((acc, r) => acc + num(r.amount), 0);
          overlay.querySelector('#stInbCount').innerText = inbList.length;
          overlay.querySelector('#stInbSum').innerText = money(rawInbSum);
          if (stIncludeInbound && stIncludeInbound.checked) {
            inbSum = rawInbSum;
          }
        }

        const periodTotal = shipSum + inbSum;
        const remainTotal = Math.max(0, currentTotal - periodTotal);

        // 마감일 이후(예: 오늘) 발생한 출고/입고 합계 안내
        const afterShipSum = outgoRecords
          .filter(r => r.warehouse === wh && r.date > e)
          .reduce((acc, r) => acc + num(r.total), 0);
        const afterInbSum = !isM
          ? inboundRecords.filter(r => r.type === 'personal_inbound' && r.date > e).reduce((acc, r) => acc + num(r.amount), 0)
          : 0;
        const afterTotal = afterShipSum + afterInbSum;

        overlay.querySelector('#stPeriodTotal').innerText = money(periodTotal);
        overlay.querySelector('#stRemainTotal').innerText = money(remainTotal);
        overlay.querySelector('#stConfirmPeriod').innerText = `선택 기간 입금 완료 (-${money(periodTotal)})`;

        const noteEl = overlay.querySelector('#stAfterNote');
        if (afterTotal > 0) {
          noteEl.innerHTML = `💡 마감일(${e}) 이후 발생한 미정산 금액 <b>${money(afterTotal)}</b>이 누적금에 안전하게 남습니다.`;
        } else {
          noteEl.innerHTML = `※ 마감일(${e}) 이후에 입력된 출고 내역은 없습니다.`;
        }

        calcResult = { periodTotal, remainTotal, s, e };
      }

      stStart.addEventListener('input', updateCalc);
      stEnd.addEventListener('input', updateCalc);
      if (stIncludeInbound) stIncludeInbound.addEventListener('change', updateCalc);

      overlay.querySelector('#stQuickYesterday').onclick = () => {
        stStart.value = (lastSettled && lastSettled[wh]) ? addDaysISO(lastSettled[wh], 1) : thisMonthStartStr;
        stEnd.value = yesterdayStr;
        updateCalc();
      };
      overlay.querySelector('#stQuickToday').onclick = () => {
        stStart.value = (lastSettled && lastSettled[wh]) ? addDaysISO(lastSettled[wh], 1) : thisMonthStartStr;
        stEnd.value = todayStr;
        updateCalc();
      };
      overlay.querySelector('#stQuickLastMonth').onclick = () => {
        stStart.value = lastMonthStartStr;
        stEnd.value = lastMonthEndStr;
        updateCalc();
      };

      overlay.querySelector('#stCloseX').onclick = close;
      overlay.querySelector('#stCancel').onclick = close;
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

      overlay.querySelector('#stConfirmPeriod').onclick = () => {
        const { periodTotal, remainTotal, s, e } = calcResult;
        if (s > e) {
          alert('출고 시작일이 마감일보다 늦을 수 없습니다.');
          return;
        }
        if (periodTotal <= 0) {
          if (!confirm(`선택하신 기간(${s} ~ ${e})의 정산 합계가 0원입니다.
마감일 기록만 ${e}로 업데이트할까요?`)) return;
        } else {
          if (!confirm(`[${wh} 기간 정산 확인]

• 정산 기간: ${s} ~ ${e}
• 선택 기간 합계: ${money(periodTotal)}
• 차감 후 남을 누적금: ${money(remainTotal)}

위 금액을 입금(정산) 완료 처리할까요?`)) return;
        }

        if (isM) {
          settlement.myeong = remainTotal;
        } else {
          settlement.eumbong = remainTotal;
        }
        lastSettled[wh] = e;
        saveJSON(KEYS.settlement, settlement);
        saveJSON(KEYS.lastSettled, lastSettled);
        syncHeader();
        refreshSettingsSettlementBadges();
        close();
        alert(`${wh} 기간 정산 완료!

• 차감 금액: ${money(periodTotal)}
• 남은 누적금: ${money(remainTotal)}`);
      };

      overlay.querySelector('#stForceZero').onclick = () => {
        if (!confirm(`기간 계산 없이 현재 ${wh} 정산 누적 금액(${money(currentTotal)})을 모두 0원으로 초기화할까요?`)) return;
        if (isM) {
          settlement.myeong = 0;
        } else {
          settlement.eumbong = 0;
        }
        lastSettled[wh] = todayStr;
        saveJSON(KEYS.settlement, settlement);
        saveJSON(KEYS.lastSettled, lastSettled);
        syncHeader();
        refreshSettingsSettlementBadges();
        close();
        alert(`${wh} 정산 누적 금액이 0원으로 초기화되었습니다.`);
      };

      updateCalc();
    }

    // 1. 명성 입금 완료 (기간 지정 정산 모달 열기)
    document.getElementById('resetMyeong').onclick = () => openSettlementModal('명성');

    // 2. 음봉 입금 완료 (기간 지정 정산 모달 열기)
    document.getElementById('resetEumbong').onclick = () => openSettlementModal('음봉');

    bindAutoSelectInput(document.getElementById('setRate'));
    bindAutoSelectInput(document.getElementById('setTruck'));

    const table = document.getElementById('itemsTable');
    function drawItems(){
      table.innerHTML = '';
      items.forEach((it, idx) => {
        const isPinned = !!it.pinned;
        const row = document.createElement('div');
        row.className = `border rounded-2xl p-3 space-y-2.5 transition ${isPinned ? 'bg-amber-50/60 border-amber-300' : 'bg-gray-50 border-gray-200'}`;
        row.innerHTML = `
          <!-- 1줄: 번호 + 품목명 입력칸 (세로 화면에서도 품목명이 넓고 선명하게 보이도록 전체 폭 할당) -->
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-full bg-slate-700 text-white text-xs font-extrabold flex items-center justify-center flex-shrink-0">${idx + 1}</span>
            <input data-i="${idx}" data-f="name" class="flex-1 min-w-0 border border-gray-300 px-3 py-2 rounded-xl text-base font-extrabold bg-white ${it.lock ? 'text-gray-600 bg-gray-100' : 'text-gray-900'}" value="${it.name}" ${it.lock ? 'disabled' : ''} placeholder="품목명 입력" />
          </div>
          <!-- 2줄: 출고 기본표시 스위치 + 위/아래 순서 이동 + 삭제 단추 -->
          <div class="flex items-center justify-between gap-2">
            <button type="button" data-pin="${idx}" class="px-3 py-1.5 rounded-xl text-xs font-extrabold border whitespace-nowrap ${isPinned ? 'bg-amber-400 text-amber-950 border-amber-500 shadow-sm' : 'bg-white text-gray-600 border-gray-300'}">
              ${isPinned ? '⭐ 기본표시' : '☆ 기타접기'}
            </button>
            <div class="flex items-center gap-1.5">
              <button type="button" data-move="up" data-idx="${idx}" class="w-9 h-8 rounded-lg border border-gray-300 bg-white font-extrabold text-xs flex items-center justify-center ${idx === 0 ? 'opacity-30 cursor-not-allowed' : 'active:bg-gray-100'}" ${idx === 0 ? 'disabled' : ''}>▲</button>
              <button type="button" data-move="down" data-idx="${idx}" class="w-9 h-8 rounded-lg border border-gray-300 bg-white font-extrabold text-xs flex items-center justify-center ${idx === items.length - 1 ? 'opacity-30 cursor-not-allowed' : 'active:bg-gray-100'}" ${idx === items.length - 1 ? 'disabled' : ''}>▼</button>
              <button type="button" class="px-3 h-8 rounded-lg bg-slate-800 text-white text-xs font-bold whitespace-nowrap ${it.lock ? 'opacity-30 cursor-not-allowed' : ''}" ${it.lock ? 'disabled' : ''} data-del="${idx}">삭제</button>
            </div>
          </div>
          <!-- 3줄: 명성 단가 / 음봉 단가 (5자리 이상 금액도 잘리지 않도록 상하 라벨 배치) -->
          <div class="grid grid-cols-2 gap-2">
            <div class="bg-white border border-rose-200 rounded-xl px-3 py-1.5">
              <div class="text-[11px] font-extrabold text-rose-700">명성 단가</div>
              <div class="flex items-center mt-0.5">
                <input data-i="${idx}" data-f="m" type="number" class="w-full min-w-0 text-right text-base font-extrabold outline-none bg-transparent ${it.lock ? 'text-gray-400' : 'text-gray-900'}" value="${num(it.myeongseong)}" ${it.lock ? 'disabled' : ''} />
                <span class="text-xs text-gray-500 ml-1 flex-shrink-0">원</span>
              </div>
            </div>
            <div class="bg-white border border-sky-200 rounded-xl px-3 py-1.5">
              <div class="text-[11px] font-extrabold text-sky-700">음봉 단가</div>
              <div class="flex items-center mt-0.5">
                <input data-i="${idx}" data-f="e" type="number" class="w-full min-w-0 text-right text-base font-extrabold outline-none bg-transparent text-gray-900" value="${num(it.eumbong)}" />
                <span class="text-xs text-gray-500 ml-1 flex-shrink-0">원</span>
              </div>
            </div>
          </div>
        `;
        table.appendChild(row);
      });

      // 숫자 입력칸 자동 전체선택 + 엔터시 키보드 닫기 적용
      table.querySelectorAll('input[type="number"]').forEach(inp => bindAutoSelectInput(inp));

      // ⭐ 기본표시 / 기타접기 토글 (즉시 저장 반영)
      table.querySelectorAll('button[data-pin]').forEach(btn => {
        btn.onclick = () => {
          const idx = Number(btn.dataset.pin);
          if (!items[idx]) return;
          items[idx].pinned = !items[idx].pinned;
          saveJSON(KEYS.items, items);
          drawItems();
        };
      });

      // ▲ / ▼ 순서 이동 (즉시 저장 반영)
      table.querySelectorAll('button[data-move]').forEach(btn => {
        btn.onclick = () => {
          const idx = Number(btn.dataset.idx);
          const dir = btn.dataset.move;
          const targetIdx = dir === 'up' ? idx - 1 : idx + 1;
          if (targetIdx < 0 || targetIdx >= items.length) return;
          const temp = items[idx];
          items[idx] = items[targetIdx];
          items[targetIdx] = temp;
          saveJSON(KEYS.items, items);
          drawItems();
        };
      });

      // 품목 삭제 (즉시 저장 반영)
      table.querySelectorAll('button[data-del]').forEach(btn => {
        btn.onclick = () => {
          const idx = Number(btn.dataset.del);
          if (!items[idx] || items[idx].lock) return;
          if (!confirm(`'${items[idx].name}' 품목을 삭제할까요?`)) return;
          items.splice(idx, 1);
          saveJSON(KEYS.items, items);
          drawItems();
        };
      });

      // 이름 / 단가 수정 시 메모리 반영 (단가 최종 확정 및 적용일 지정은 '품목/단가 저장' 버튼에서 처리)
      table.querySelectorAll('input[data-f]').forEach(inp => {
        inp.oninput = () => {
          const i = Number(inp.dataset.i);
          const f = inp.dataset.f;
          if (f === 'name') items[i].name = inp.value;
          if (f === 'm') items[i].myeongseong = num(inp.value);
          if (f === 'e') items[i].eumbong = num(inp.value);
        };
      });
    }

    drawItems();

    document.getElementById('addItem').onclick = () => {
      items.push({ name:'새 품목', myeongseong:0, eumbong:0, pinned:false });
      saveJSON(KEYS.items, items);
      drawItems();
    };

    document.getElementById('saveItems').onclick = () => {
      const item189 = items.find(x => x.name === '18.9L');
      const eumbong189Rate = item189 ? num(item189.eumbong) : personalRate;
      const showSync189 = item189 && (eumbong189Rate !== num(document.getElementById('setRate').value));

      openEffectiveDateModal({
        title: '품목/단가 저장',
        desc: '변경한 품목 단가를 몇 월 며칠부터 반영할까요?',
        syncOptionLabel: showSync189 ? `상단 '개인재고 18.9L 정산 단가'도 ${money(eumbong189Rate)}으로 함께 변경` : '',
        onConfirm: (applyFrom, syncPersonal189) => {
          const todayStr = todayISO();
          saveJSON(KEYS.items, items);

          if (applyFrom > todayStr) {
            priceSchedule.items = {
              applyFrom,
              prevItems: { ...activeItemsPriceMapToday }
            };
          } else {
            priceSchedule.items = null;
          }

          if (syncPersonal189 && item189) {
            personalRate = eumbong189Rate;
            document.getElementById('setRate').value = personalRate;
            localStorage.setItem(KEYS.personalRate, String(personalRate));
            if (applyFrom > todayStr) {
              priceSchedule.personalRate = {
                applyFrom,
                prevRate: activePersonalRateToday,
                newRate: personalRate
              };
            } else {
              priceSchedule.personalRate = null;
            }
          }

          saveJSON(KEYS.priceSchedule, priceSchedule);
          refreshScheduleBanner();
          if (applyFrom > todayStr) {
            alert(`품목/단가 저장 완료!

• 적용 시작일: ${applyFrom}부터 새 단가 반영
• ${applyFrom} 이전 날짜의 전표에는 기존 단가가 자동 적용됩니다.`);
          } else {
            alert(`품목/단가 저장 완료!
오늘(${todayStr})부터 즉시 새 단가가 적용됩니다.`);
          }
        }
      });
    };

    // 백업
    document.getElementById('backupBtn').onclick = () => {
      const data = {
        items,
        outgoRecords,
        inboundRecords,
        myStock,
        containerHeld,
        settlement,
        lastSettled,
        priceSchedule,
        personalRate,
        truckSize
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `water_io_backup_${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    // 복원
    document.getElementById('restoreInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!confirm('이 파일로 데이터를 복원할까요?\n현재 데이터는 덮어씌워집니다.')) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          items = data.items || items;
          normalizeItemsData();
          outgoRecords = data.outgoRecords || [];
          inboundRecords = data.inboundRecords || [];
          myStock = data.myStock || myStock;
          containerHeld = data.containerHeld || containerHeld;
          settlement = data.settlement || settlement;
          lastSettled = data.lastSettled || lastSettled || { 명성:'', 음봉:'' };
          priceSchedule = data.priceSchedule || { personalRate: null, items: null };
          saveJSON(KEYS.lastSettled, lastSettled);
          saveJSON(KEYS.priceSchedule, priceSchedule);
          personalRate = num(data.personalRate || personalRate);
          truckSize = num(data.truckSize || truckSize);

          saveJSON(KEYS.items, items);
          saveJSON(KEYS.outgo, outgoRecords);
          saveJSON(KEYS.inbound, inboundRecords);
          saveJSON(KEYS.myStock, myStock);
          saveJSON(KEYS.containerHeld, containerHeld);
          saveJSON(KEYS.settlement, settlement);
          localStorage.setItem(KEYS.personalRate, String(personalRate));
          localStorage.setItem(KEYS.truckSize, String(truckSize));

          syncHeader();
          alert('데이터 복원이 완료되었습니다.');
          show('home');
        } catch(err) {
          alert('복원 실패: 올바른 백업 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    };

    document.getElementById('resetAll').onclick = () => {
      if (!confirm('⚠ 모든 데이터(출고/입고/정산/재고/설정)를 삭제합니다.\n\n정말 초기화할까요?')) return;
      const keysToRemove = [KEYS.items, KEYS.outgo, KEYS.inbound, KEYS.myStock, KEYS.containerHeld, KEYS.settlement, KEYS.lastSettled, KEYS.priceSchedule, KEYS.personalRate, KEYS.truckSize];
      keysToRemove.forEach(k => localStorage.removeItem(k));
      // reset runtime state
      items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
      outgoRecords = [];
      inboundRecords = [];
      myStock = { '18.9L': 0 };
      containerHeld = { 명성:{}, 음봉:{} };
      for (const wh of ['명성','음봉']) {
        containerHeld[wh] = {};
        for (const t of CONTAINER_TYPES) containerHeld[wh][t.key] = 0;
      }
      settlement = { myeong:0, eumbong:0 };
      lastSettled = { 명성:'', 음봉:'' };
      priceSchedule = { personalRate: null, items: null };
      personalRate = 1800;
      truckSize = 864;
      syncHeader();
      alert('초기화 완료');
      show('home');
    };
  }

  // ===== 뒤로가기(B안) 처리 =====
  window.onpopstate = function(e){
    // ✏ 출고/입고 수정 중(back) 처리: 저장 없이 나가면 수정 취소
    if (editingRecord) {
      if (confirm('수정을 취소하고 메인 화면으로 돌아갈까요?')) {
        editingRecord = null;
        show('home');
      } else {
        history.pushState({ screen: 'shipping' }, '', '#shipping');
      }
      return;
    }
    if (window.editingInboundRecord) {
      if (confirm('수정을 취소하고 메인 화면으로 돌아갈까요?')) {
        window.editingInboundRecord = null;
        show('home');
      } else {
        history.pushState({ screen: 'inbound' }, '', '#inbound');
      }
      return;
    }

    const header = document.getElementById('appHeader');
    if (header && header.style.display === 'none') {
      show('home');
      return;
    }
    if (confirm('앱을 종료할까요?')) {
      history.go(-1);
    } else {
      history.pushState({ screen: 'home' }, '', '#home');
    }
  };

  // initial render
  syncHeader();
  history.replaceState({ screen: 'home' }, '', '#home');

// intro title fade-out
setTimeout(()=>{
  const intro = document.getElementById('introTitle');
  if(intro){
    intro.firstElementChild.classList.add('opacity-0');
    setTimeout(()=>{
      intro.remove();
      const header = document.getElementById('appHeader');
      if(header) header.style.display = 'block';
    }, 500);
  }
}, 1000);

show('home');

</script>
</body>
</html>
